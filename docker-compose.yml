services:
  app:
    image: analytics-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:  
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/code/src
    develop:
      watch:
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: docker-compose.yml
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload